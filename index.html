<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panela de Ferro | Marmitas em Itajubá</title>
  <meta name="description" content="Peça marmitas conversando com a Nena, atendente virtual da Panela de Ferro.">
  <!-- Guardrail extra: a página só carrega código próprio e só conversa com o Worker do Cloudflare (que fala com o Groq) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://marmita-api.pereirabeatrizsilva.workers.dev; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="alca" aria-hidden="true"></span>
      <div>
        <h1>Panela de Ferro</h1>
        <p class="sub">Marmitas em Itajubá, entregues das 11h às 14h30</p>
      </div>
    </div>
    <p class="hoje" id="hoje"></p>
  </header>

  <main class="palco">
    <section class="conversa" aria-label="Conversa com a atendente">
      <ol id="mensagens" class="mensagens" aria-live="polite"></ol>

      <div class="atalhos" id="atalhos" aria-label="Sugestões">
        <button type="button" data-texto="O que tem no cardápio hoje?">Cardápio de hoje</button>
        <button type="button" data-texto="Quais bairros vocês atendem e quanto é a entrega?">Taxas de entrega</button>
        <button type="button" data-texto="Quanto está meu pedido com a entrega?">Total com entrega</button>
      </div>

      <button id="verComanda" class="ver-comanda" type="button" aria-controls="comanda" aria-expanded="false">
        <span>Ver comanda</span><strong id="vTotalMini">R$ 0,00</strong>
      </button>

      <form id="form" class="compor" autocomplete="off">
        <label for="entrada" class="sr">Sua mensagem</label>
        <textarea id="entrada" rows="1" maxlength="500" placeholder="Ex.: 2 de frango, uma sem feijão"></textarea>
        <button id="enviar" class="btn btn-cheio" type="submit">Enviar</button>
      </form>
    </section>

    <aside class="comanda" id="comanda" aria-label="Seu pedido">
      <div class="papel">
        <div class="papel-topo">
          <div class="papel-titulo"><h2>Comanda</h2><button type="button" id="fecharComanda" class="fechar">Fechar</button></div>
          <p id="comandaStatus" class="estado"></p>
        </div>
        <ul id="linhas" class="linhas"></ul>
        <dl class="contas">
          <div><dt>Subtotal</dt><dd id="vSub">R$ 0,00</dd></div>
          <div><dt id="rEntrega">Entrega</dt><dd id="vEntrega">a definir</dd></div>
          <div class="total"><dt>Total</dt><dd id="vTotal">R$ 0,00</dd></div>
        </dl>
        <p id="freteNota" class="nota-frete"></p>
        <div id="cliente" class="cliente"></div>
        <div id="acoesComanda" class="acoes"></div>
      </div>
    </aside>
  </main>



  <script type="module" src="app.js"></script>
</body>
</html>
